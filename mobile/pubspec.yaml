name: de_moi_dity
description: "Де мої діти — family locator for Ukraine (parent and child apps from one codebase)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.0
  socket_io_client: ^3.1.1
  uuid: ^4.5.1

  geolocator: ^13.0.2
  battery_plus: ^6.2.1
  connectivity_plus: ^6.1.3
  device_info_plus: ^11.3.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
  flutter_local_notifications: ^18.0.1

  mobile_scanner: ^6.0.7
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  generate: true
