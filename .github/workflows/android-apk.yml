# Збірка Android APK на серверах GitHub.
# Готовий APK — у вкладці Actions → запуск → Artifacts → moi-dity-apk.
name: Android APK

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Адреса сервера для застосунку (порожньо — змінна репозиторію API_URL або http://10.0.2.2:8080)'
        required: false
        default: ''

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/android/*.gradle*
            app/android/**/gradle-wrapper.properties

      # Версія, на якій створено й перевірено застосунок (app/.metadata).
      # У 3.50 package:flutter/material.dart став deprecated, і flutter analyze падає.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Залежності
        run: flutter pub get

      - name: Аналіз коду
        run: flutter analyze

      - name: Тести
        run: flutter test

      # Секрет GOOGLE_SERVICES_JSON — вміст google-services.json (Firebase, проєкт my-kids-1f72d).
      # Без нього APK збирається, але без пушів.
      - name: google-services.json із секрету
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Firebase: увімкнено"
          else
            echo "::notice::Секрет GOOGLE_SERVICES_JSON не задано — APK без пушів"
          fi

      - name: Збірка APK
        env:
          API_URL: ${{ inputs.api_url || vars.API_URL || 'http://10.0.2.2:8080' }}
        run: |
          echo "API_URL=$API_URL"
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL="$API_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: moi-dity-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
