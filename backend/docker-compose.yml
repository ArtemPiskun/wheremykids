# Local stack: PostgreSQL, Redis and the API. Secrets come from .env (see .env.example).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demoidity
      POSTGRES_PASSWORD: demoidity
      POSTGRES_DB: demoidity
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demoidity"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://demoidity:demoidity@postgres:5432/demoidity
      REDIS_URL: redis://redis:6379
    command: ["node", "dist/database/migrate.js"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://demoidity:demoidity@postgres:5432/demoidity
      REDIS_URL: redis://redis:6379
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

volumes:
  pgdata:
