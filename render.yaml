# Розгортання сервера «Мої діти» на Render (https://render.com) як Blueprint.
# Покрокова інструкція: docs/deploy-render.md
services:
  - type: web
    runtime: docker
    name: moi-dity-server
    region: frankfurt
    plan: 0.5c-512mb          # ~$7/міс; безкоштовний план засинає і зупиняє опитування тривог
    dockerfilePath: server/Dockerfile
    dockerContext: server
    healthCheckPath: /healthz
    autoDeploy: true          # кожен merge у main автоматично перевикладає сервер
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: moi-dity-db
          property: connectionString
      - key: NODE_ENV
        value: production
      # Поки немає файлу меж областей, область дитини визначаємо через OpenStreetMap
      - key: USE_NOMINATIM
        value: "1"
      - key: FIREBASE_PROJECT_ID
        value: my-kids-1f72d
      - key: LOCATION_RETENTION_DAYS
        value: "30"
      # Секрети: Render попросить їх вписати під час створення Blueprint
      - key: FIREBASE_SERVICE_ACCOUNT_BASE64
        sync: false
      - key: ALERTS_IN_UA_TOKEN
        sync: false

databases:
  - name: moi-dity-db
    region: frankfurt
    plan: 0.1c-256mb          # ~$6/міс; безкоштовна база на Render тимчасова
    postgresMajorVersion: "16"
    databaseName: moi
    user: moi
    ipAllowList: []           # база доступна лише серверу всередині Render
